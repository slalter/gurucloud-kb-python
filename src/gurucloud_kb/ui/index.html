<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KB Explorer</title>
  <meta name="description" content="Explore a GuruCloud Knowledge Bank: entries, clusters, playbooks, schema, quality and history.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2372a6ab'/%3E%3Crect x='11' y='11' width='3.6' height='9' rx='1.8' fill='%23fff'/%3E%3Crect x='17.4' y='11' width='3.6' height='9' rx='1.8' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/bootstrap-icons.min.css">
  <link rel="stylesheet" href="kb-explorer.css">
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { background: #f7f6f2; }
  </style>
</head>
<body class="kbx kbx-page">
  <main class="kbx-wrap">
    <div id="kbx-root"
         data-mode="{{MODE}}"
         data-api-base="{{API_BASE}}"
         data-banks-url="{{BANKS_URL}}"
         data-stats-url="{{STATS_URL}}"
         {{TOKEN_GATE}}></div>
  </main>
  <script src="vendor/cytoscape.min.js"></script>
  <script src="vendor/dagre.min.js"></script>
  <script src="vendor/cytoscape-dagre.js"></script>
  <script type="module" src="js/host.js"></script>
</body>
</html>
